services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      META_ACCESS_TOKEN: ${META_ACCESS_TOKEN:?set META_ACCESS_TOKEN in Coolify}
      META_BUSINESS_ID: ${META_BUSINESS_ID:?set META_BUSINESS_ID in Coolify}
      META_AD_ACCOUNT_ID: ${META_AD_ACCOUNT_ID:-}
      META_API_VERSION: ${META_API_VERSION:-v26.0}
      META_SYSTEM_USER_ID: ${META_SYSTEM_USER_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:?set META_APP_SECRET in Coolify}
      META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN:?set META_WEBHOOK_VERIFY_TOKEN in Coolify}
      INBOX_DB_PATH: ${INBOX_DB_PATH:-/data/inbox.sqlite}
      MEDARBEITER_URL: ${MEDARBEITER_URL:-https://hub.med-arbeiter.de}
      MEDARBEITER_CLIENT_ID: ${MEDARBEITER_CLIENT_ID:?set MEDARBEITER_CLIENT_ID in Coolify}
      MEDARBEITER_CLIENT_SECRET: ${MEDARBEITER_CLIENT_SECRET:?set MEDARBEITER_CLIENT_SECRET in Coolify}
      MEDARBEITER_REDIRECT_URI: ${MEDARBEITER_REDIRECT_URI:?set MEDARBEITER_REDIRECT_URI in Coolify}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in Coolify}
    volumes:
      - inbox-db:/data

volumes:
  inbox-db:
